<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCP - Brasil Play Alpha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 420px;
        }
        h2 { text-align: center; color: #ffffff; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-top: 5px; background-color: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; margin-top: 15px; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .btn-secondary { background-color: #28a745; }
        .btn-secondary:hover { background-color: #218838; }
        .btn-discord { background-color: #5865F2; }
        .btn-discord:hover { background-color: #4752C4; }
        .btn-logout { background-color: #dc3545; }
        .btn-logout:hover { background-color: #c82333; }
        #mensagem { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
        .hidden { display: none; }
        .card { background: #2d2d2d; padding: 15px; border-radius: 6px; margin-top: 15px; border-left: 4px solid #007bff; }
        .card p { margin: 8px 0; font-size: 14px; }
        .ip-box { background: #111; padding: 10px; border-radius: 4px; text-align: center; font-family: monospace; font-size: 15px; color: #00ffcc; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ECRÃ DE LOGIN / REGISTO -->
        <div id="authScreen">
            <h2>Brasil Play Alpha</h2>
            <form id="authForm" onsubmit="return false;">
                <label for="email">E-mail:</label>
                <input type="email" id="email" required placeholder="seu_email@exemplo.com">

                <label for="password">Palavra-passe:</label>
                <input type="password" id="password" required placeholder="Sua palavra-passe">

                <button type="button" id="btnLogin">Entrar</button>
                <button type="button" id="btnRegister" class="btn-secondary">Criar Conta</button>
            </form>
            <div id="mensagem"></div>
        </div>

        <!-- ECRÃ DA UCP / PAINEL COMPLETO -->
        <div id="dashboardScreen" class="hidden">
            <h2>Painel do Jogador</h2>
            
            <div class="card">
                <p><strong>Conta:</strong> <span id="userEmailDisplay"></span></p>
                <p><strong>Estado:</strong> <span style="color: #28a745;">Online na UCP</span></p>
                <p><strong>Servidor:</strong> Brasil Play Alpha [SA-MP]</p>
            </div>

            <div class="ip-box">
                IP: play.brasilplayalpha.com:7777
            </div>

            <button type="button" class="btn-secondary" onclick="alert('A descarregar Launcher APK...')">Baixar Launcher APK</button>
            <button type="button" class="btn-discord" onclick="window.open('https://discord.gg/exemplo', '_blank')">Entrar no Discord</button>
            <button type="button" id="btnLogout" class="btn-logout">Terminar Sessão</button>
        </div>
    </div>

    <script>
        const authScreen = document.getElementById('authScreen');
        const dashboardScreen = document.getElementById('dashboardScreen');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const mensagemDiv = document.getElementById('mensagem');

        function mostrarPainel(email) {
            userEmailDisplay.innerText = email;
            authScreen.classList.add('hidden');
            dashboardScreen.classList.remove('hidden');
        }

        // Criar Conta
        document.getElementById('btnRegister').addEventListener('click', () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                mensagemDiv.style.color = '#dc3545';
                mensagemDiv.innerText = 'Preencha todos os campos.';
                return;
            }

            const contaExistente = localStorage.getItem('ucp_email_' + email);
            if (contaExistente) {
                mensagemDiv.style.color = '#dc3545';
                mensagemDiv.innerText = 'Este e-mail já está registado!';
                return;
            }

            localStorage.setItem('ucp_email_' + email, password);
            mostrarPainel(email);
        });

        // Entrar (Login)
        document.getElementById('btnLogin').addEventListener('click', () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                mensagemDiv.style.color = '#dc3545';
                mensagemDiv.innerText = 'Preencha todos os campos.';
                return;
            }

            const senhaGuardada = localStorage.getItem('ucp_email_' + email);

            if (!senhaGuardada || senhaGuardada !== password) {
                mensagemDiv.style.color = '#dc3545';
                mensagemDiv.innerText = 'E-mail ou palavra-passe incorretos.';
                return;
            }

            mostrarPainel(email);
        });

        // Terminar Sessão (Logout)
        document.getElementById('btnLogout').addEventListener('click', () => {
            dashboardScreen.classList.add('hidden');
            authScreen.classList.remove('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            mensagemDiv.innerText = '';
        });
    </script>
</body>
</html>
