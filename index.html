  <script>
    const URL_BASE_API = 'https://ucp-api-bpa.onrender.com/api';
    let modoRegisto = false;
    let modoEsqueci = false;

    function mostrarAviso(mensagem) {
      const toast = document.getElementById('custom-toast');
      toast.innerText = mensagem;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    function tocarSomClique() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.08);
        gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch(e) {}
    }

    function mudarAba(idAba, elementoBotao) {
      document.querySelectorAll('.tab-pane').forEach(aba => aba.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      document.getElementById(idAba).classList.add('active');
      if (elementoBotao) elementoBotao.classList.add('active');
      document.body.className = '';
      if (idAba === 'tab-downloads') document.body.classList.add('bg-downloads');
      if (idAba === 'tab-comunidade') document.body.classList.add('bg-comunidade');
    }

    function copiarIP(idElemento) {
      const ipText = document.getElementById(idElemento).innerText;
      navigator.clipboard.writeText(ipText).then(() => {
        mostrarAviso("IP copiado com sucesso: " + ipText);
      });
    }

    function toggleMusica() {
      const audio = document.getElementById('bgMusic');
      const btn = document.getElementById('musicToggleBtn');
      if (audio.paused) {
        audio.play();
        btn.classList.remove('muted');
        btn.innerText = '🎵';
      } else {
        audio.pause();
        btn.classList.add('muted');
        btn.innerText = '🔇';
      }
    }

    function alternarModoAuth() {
      modoRegisto = !modoRegisto;
      modoEsqueci = false;
      atualizarInterfaceAuth();
    }

    function alternarModoEsqueciSenha() {
      modoEsqueci = !modoEsqueci;
      modoRegisto = false;
      atualizarInterfaceAuth();
    }

    function atualizarInterfaceAuth() {
      const title = document.getElementById('auth-title');
      const btn = document.getElementById('auth-main-btn');
      const toggleBtn = document.getElementById('toggle-auth-mode');
      const forgotBtn = document.getElementById('forgot-pass-btn');
      const serverGroup = document.getElementById('server-group-div');
      const passGroup = document.getElementById('pass-group-div');
      const emailGroup = document.getElementById('email-group-div');

      if (modoEsqueci) {
        title.innerText = 'RECUPERAR PALAVRA-PASSE';
        btn.innerText = 'Enviar Instruções';
        passGroup.style.display = 'none';
        emailGroup.style.display = 'block';
        serverGroup.style.display = 'none';
        toggleBtn.innerText = 'Voltar ao Login';
        forgotBtn.style.display = 'none';
      } else if (modoRegisto) {
        title.innerText = 'CRIAR NOVA CONTA';
        btn.innerText = 'Registar Conta';
        passGroup.style.display = 'block';
        emailGroup.style.display = 'block';
        serverGroup.style.display = 'none';
        toggleBtn.innerText = 'Já tem conta? Faça login';
        forgotBtn.style.display = 'inline';
      } else {
        title.innerText = 'ENTRAR NA UCP';
        btn.innerText = 'Aceder Painel';
        passGroup.style.display = 'block';
        emailGroup.style.display = 'none';
        serverGroup.style.display = 'block';
        toggleBtn.innerText = 'Não tem conta? Criar nova conta';
        forgotBtn.style.display = 'inline';
      }
      document.getElementById('mensagem-auth').innerText = '';
    }

    async function executarAcaoAuth() {
      const nick = document.getElementById('userInput').value.trim();
      const pass = document.getElementById('passInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const server = document.getElementById('serverSelect').value;
      const msg = document.getElementById('mensagem-auth');
      
      if(!nick || (!pass && !modoEsqueci && !modoRegisto) || (modoRegisto && (!pass || !email)) || (modoEsqueci && !email)) {
        msg.style.color = '#ff1a1a';
        msg.innerText = 'Preencha todos os campos obrigatórios!';
        return;
      }

      msg.style.color = '#fff';
      msg.innerText = 'A processar pedido...';

      try {
        let endpoint = '/login';
        let dadosEnvio = { nick, senha: pass, servidor: server };

        if (modoRegisto) {
          endpoint = '/register';
          dadosEnvio = { nick, senha: pass, email };
        } else if (modoEsqueci) {
          endpoint = '/forgot-password';
          dadosEnvio = { email };
        }

        const resposta = await fetch(URL_BASE_API + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dadosEnvio)
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
          throw new Error(resultado.erro || 'Erro ao processar a requisição.');
        }

        if (modoEsqueci) {
          msg.style.color = '#00ff64';
          msg.innerText = 'Instruções enviadas para o e-mail!';
          mostrarAviso('E-mail de recuperação enviado com sucesso.');
          return;
        }

        if (modoRegisto) {
          msg.style.color = '#00ff64';
          msg.innerText = 'Conta criada com sucesso! Faça login.';
          mostrarAviso('Conta registada com sucesso.');
          alternarModoAuth();
          return;
        }

        // LOGIN BEM-SUCEDIDO
        mostrarAviso('Login efetuado com sucesso!');
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('painel-box').classList.remove('hidden');

        // Preencher os dados do jogador dinamicamente (ajustar conforme as colunas reais da base de dados)
        if (resultado.player) {
          document.getElementById('ucp-nick').innerText = resultado.player.Nick || nick;
          document.getElementById('ucp-id').innerText = resultado.player.ID || '1';
          document.getElementById('ucp-rg').innerText = resultado.player.RG || '00000';
          document.getElementById('ucp-dinheiro').innerText = 'R$ ' + (resultado.player.Dinheiro || 0).toLocaleString();
          document.getElementById('ucp-banco').innerText = 'R$ ' + (resultado.player.Banco || 0).toLocaleString();
          document.getElementById('ucp-level').innerText = resultado.player.Level || '1';
          document.getElementById('ucp-org').innerText = resultado.player.Organizacao || 'Civil';
        }

      } catch (erro) {
        msg.style.color = '#ff1a1a';
        msg.innerText = erro.message;
        mostrarAviso(erro.message);
      }
    }

    function fazerLogout() {
      document.getElementById('painel-box').classList.add('hidden');
      document.getElementById('login-box').classList.remove('hidden');
      document.getElementById('userInput').value = '';
      document.getElementById('passInput').value = '';
      document.getElementById('emailInput').value = '';
      document.getElementById('mensagem-auth').innerText = '';
      mostrarAviso('Sessão encerrada com sucesso.');
    }

    function abrirPainelForum() {
      document.getElementById('painel-box').classList.add('hidden');
      document.getElementById('modal-forum').classList.remove('hidden');
    }

    function fecharPainelForum() {
      document.getElementById('modal-forum').classList.add('hidden');
      document.getElementById('painel-box').classList.remove('hidden');
    }

    function mudarAbaForum(nomeAba, elementoBtn) {
      document.querySelectorAll('.forum-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.forum-tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('f-tab-' + nomeAba).classList.add('active');
      elementoBtn.classList.add('active');
    }

    function enviarMensagemChat() {
      const input = document.getElementById('chatInputText');
      const texto = input.value.trim();
      if (!texto) return;
      const chatBox = document.getElementById('chatMessages');
      const novaMsg = document.createElement('div');
      novaMsg.className = 'chat-msg';
      novaMsg.innerHTML = `<span>[Você]:</span> ${texto}`;
      chatBox.appendChild(novaMsg);
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function enviarDenuncia() {
      const nickInf = document.getElementById('denunciaNick').value.trim();
      const motivo = document.getElementById('denunciaMotivo').value.trim();
      if (!nickInf || !motivo) {
        mostrarAviso('Preencha todos os campos da denúncia!');
        return;
      }
      mostrarAviso('Denúncia transmitida à moderação com sucesso.');
      document.getElementById('denunciaNick').value = '';
      document.getElementById('denunciaMotivo').value = '';
    }
  </script>
