<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denúncias BPA</title>
    <!-- Incluir o script do Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #ffffff;
        }
        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
        }
        textarea, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Painel de Denúncias BPA</h2>
        <form id="denunciaForm">
            <label for="titulo">Título da Denúncia:</label>
            <input type="text" id="titulo" required placeholder="Ex: Ocorrência na área rural">

            <label for="descricao">Descrição:</label>
            <textarea id="descricao" rows="5" required placeholder="Descreva os detalhes da denúncia..."></textarea>

            <button type="submit" id="btnEnviar">Enviar Denúncia</button>
        </form>
        <div id="mensagem"></div>
    </div>

    <script>
        // Configuração do Supabase
        const SUPABASE_URL = 'https://yayjfnzval..........supabase.co'; // Substitua pelo seu URL do projeto Supabase se necessário
        const SUPABASE_ANON_KEY = 'sb_publishable_TvJJMdZBhsCdPAI0wYyjzg_g-YYZN3t';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('denunciaForm');
        const mensagemDiv = document.getElementById('mensagem');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnEnviar = document.getElementById('btnEnviar');
            btnEnviar.disabled = true;
            btnEnviar.innerText = 'A enviar...';
            mensagemDiv.innerText = '';

            const titulo = document.getElementById('titulo').value;
            const descricao = document.getElementById('descricao').value;

            try {
                const { data, error } = await _supabase
                    .from('Denuncias BPA')
                    .insert([{ titulo: titulo, descricao: descricao }]);

                if (error) {
                    throw error;
                }

                mensagemDiv.style.color = '#28a745';
                mensagemDiv.innerText = 'Denúncia enviada com sucesso!';
                form.reset();
            } catch (error) {
                console.error('Erro ao enviar:', error);
                mensagemDiv.style.color = '#dc3545';
                mensagemDiv.innerText = 'Erro ao enviar denúncia: ' + error.message;
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.innerText = 'Enviar Denúncia';
            }
        });
    </script>
</body>
</html>
